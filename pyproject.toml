[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "drift-sense"
version = "0.1.0"
description = "Deterministic periodic-structure localization for wafer inspection images"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "opencv-python-headless>=4.9,<5",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
