[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "metralign"
version = "0.2.0"
description = "Deterministic localization under periodic ambiguity"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "opencv-python-headless>=4.9,<5",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
comparison = [
  "scikit-image==0.25.2; python_version < '3.11'",
  "scikit-image==0.26.0; python_version >= '3.11'",
]

[project.scripts]
metralign = "metralign.cli:main"

[project.urls]
Homepage = "https://achxy.github.io/metralign/"
Repository = "https://github.com/Achxy/metralign"
Documentation = "https://github.com/Achxy/metralign#readme"
Issues = "https://github.com/Achxy/metralign/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
