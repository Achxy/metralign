schema_version: 1

project:
  name: Metralign
  technical_title: Absolute-site localization under periodic ambiguity
  submission_context: Drift-Sense submission
  event: SEMICON India Hackathon 2026
  repository_url: https://github.com/Achxy/metralign
  website_url: https://achxy.github.io/metralign/
  license: MIT
  version_source:
    file: ../pyproject.toml
    key: project.version
  team:
    display_name: Achyuth Jayadevan · Pramit Karmakar
    institution: MIT MANIPAL
    members:
      - Achyuth Jayadevan
      - Pramit Karmakar

film:
  title: Metralign — Technical Demonstration
  purpose: Judge-facing academic and industrial technical film
  language: en
  maximum_duration_seconds: 300
  target_duration_seconds: 205
  frame:
    width: 1920
    height: 1080
    fps: 30
    aspect_ratio: "16:9"
    background: "#090909"
  metadata:
    title: Metralign — Absolute-site localization under periodic ambiguity
    artist: Achyuth Jayadevan and Pramit Karmakar
    project: SEMICON India Hackathon 2026
    comment: Reproducible technical demonstration assembled from verified project evidence

theme:
  colors:
    background: "#0B0B0E"
    black_secondary: "#15151A"
    graphite: "#23242A"
    primary_text: "#F3F1EB"
    muted_text: "#AAA8A2"
    rule: "#34353D"
    prediction: "#E36A45"
    ground_truth: "#67A9CE"
  fonts:
    display: Avenir Next
    body: Avenir Next
    mono: Menlo
  grid:
    columns: 12
    outer_margin_px: 96
    gutter_px: 24
    baseline_px: 24
  typography:
    display_uppercase: false
    section_uppercase: false
    label_tracking: 0.08
  transition_policy:
    default: hard_cut
    related_representation: short_dissolve
    maximum_dissolve_seconds: 0.25
  forbidden_visual_patterns:
    - rounded SaaS cards
    - gradients
    - glows
    - decorative iconography
    - pseudo HUD elements
    - synthetic scientific imagery

audio:
  sample_rate_hz: 48000
  channels: 1
  music: none
  integrated_loudness_lufs: -16
  true_peak_dbtp: -1.5
  trim_leading_silence_seconds: 0.08
  trim_trailing_silence_seconds: 0.12
  inter_segment_gap_seconds: 0.16

voice:
  provider: mimika
  adapter: qwen3_clone
  profile_id: manipal_engineer
  profile_label: Manipal
  base_url: http://127.0.0.1:7693
  endpoint: /api/qwen3/generate
  model_size: 0.6B
  model_quantization: bf16
  language: English
  speed: 1.02
  seed: 17082026
  style: calm, controlled, precise, moderately paced engineer narration
  generated_directory: voice/generated
  replacement_directory: voice/replacements/manipal_engineer
  normalized_directory: voice/stems
  manifest: voice/voice_manifest.json
  replacement_precedence: true

